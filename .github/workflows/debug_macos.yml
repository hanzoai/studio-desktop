name: Build - Mac

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  # Ensure the macOS build run doesn't cancel other reusable callers
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-debug:
    runs-on: macos-latest
    steps:
      - name: Github checkout
        uses: actions/checkout@v4

      - name: Declare some variables
        run: |
          echo "sha_short=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"
        shell: bash

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - run: pnpm install

      - name: Build Comfy
        uses: ./.github/actions/build/macos/comfy
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN_FOR_GITHUB }}

      - name: Make app
        env:
          PUBLISH: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run make

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: hanzo-studio-electron-debug-macos-${{ env.sha_short }}
          path: |
            dist/*.zip
